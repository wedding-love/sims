
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Day | The Sims 4</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #080d25;
}

/* =========================
   ЭКРАН ЗАГРУЗКИ
========================= */

#loadingScreen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 50% 85%,
        #263b70 0%,
        #111d43 40%,
        #080d25 100%);
    transition: opacity 1.2s ease, visibility 1.2s ease;
}

#loadingScreen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

/* Звёздное небо */

.stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 8px white;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from {
        opacity: 0.2;
        transform: scale(0.7);
    }
    to {
        opacity: 1;
        transform: scale(1.3);
    }
}

/* Луна */

.moon {
    position: absolute;
    top: 10%;
    right: 16%;
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: #f8f5dc;
    box-shadow:
        0 0 25px rgba(255,255,220,0.6),
        0 0 70px rgba(255,255,220,0.25);
}

/* Ромб Sims */

.plumbob {
    position: relative;
    width: 65px;
    height: 105px;
    margin-bottom: 35px;
    background: linear-gradient(
        135deg,
        #b7ff9c,
        #35c85d 45%,
        #087d36
    );
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    filter: drop-shadow(0 0 20px #5aff80);
    animation: float 2s ease-in-out infinite;
}

.plumbob::after {
    content: "";
    position: absolute;
    top: 12%;
    left: 27%;
    width: 15px;
    height: 65%;
    background: rgba(255,255,255,0.45);
    transform: rotate(35deg);
    filter: blur(3px);
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-12px);
    }
}

/* Надписи */

.game-title {
    color: white;
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 800;
    letter-spacing: 3px;
    text-shadow: 0 3px 15px rgba(0,0,0,0.5);
}

.game-subtitle {
    color: #b9d9ff;
    font-size: 13px;
    letter-spacing: 5px;
    margin-top: 12px;
    text-transform: uppercase;
}

/* Загрузка */

.loading-bottom {
    position: absolute;
    bottom: 12%;
    width: min(320px, 75%);
    text-align: center;
}

.loading-text {
    color: white;
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 15px;
    animation: blink 1.3s infinite;
}

@keyframes blink {
    50% { opacity: 0.4; }
}

.progress-track {
    height: 7px;
    background: rgba(255,255,255,0.18);
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.25);
}

.progress-bar {
    height: 100%;
    width: 0%;
    border-radius: 20px;
    background: linear-gradient(
        90deg,
        #48d66e,
        #b8ff9c
    );
    box-shadow: 0 0 12px #5aff80;
    transition: width 0.15s linear;
}

.loading-percent {
    color: rgba(255,255,255,0.7);
    font-size: 11px;
    margin-top: 10px;
    letter-spacing: 2px;
}

/* =========================
   ГЛАВНЫЙ ЭКРАН
========================= */

#mainScreen {
    position: fixed;
    inset: 0;
    opacity: 0;
    visibility: hidden;
    transition: opacity 1.5s ease;
    background: #111;
}

#mainScreen.show {
    opacity: 1;
    visibility: visible;
}

#mainScreen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
}

/* Мобильная адаптация */

@media (max-width: 600px) {
    .moon {
        width: 55px;
        height: 55px;
        right: 12%;
        top: 12%;
    }

    .plumbob {
        width: 52px;
        height: 85px;
    }

    .game-title {
        letter-spacing: 2px;
    }
}
</style>
</head>

<body>

<!-- ЭКРАН ЗАГРУЗКИ -->

<div id="loadingScreen">

    <div class="stars" id="stars"></div>

    <div class="moon"></div>

    <div class="plumbob"></div>

    <div class="game-title">THE SIMS 4</div>

    <div class="game-subtitle">
        A new chapter begins
    </div>

    <div class="loading-bottom">

        <div class="loading-text">
            Loading your special day...
        </div>

        <div class="progress-track">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="loading-percent" id="percent">
            0%
        </div>

    </div>

</div>

<!-- ГЛАВНЫЙ ЭКРАН -->

<div id="mainScreen">
    <img src="Изображение.jpeg" alt="Wedding Day">
</div>

<script>

/* =========================
   СОЗДАНИЕ ЗВЁЗД
========================= */

const starsContainer = document.getElementById("stars");

for (let i = 0; i < 100; i++) {

    const star = document.createElement("div");
    star.className = "star";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";

    star.style.animationDelay =
        Math.random() * 3 + "s";

    star.style.animationDuration =
        (1 + Math.random() * 3) + "s";

    const size = 1 + Math.random() * 3;

    star.style.width = size + "px";
    star.style.height = size + "px";

    starsContainer.appendChild(star);
}

/* =========================
   АНИМАЦИЯ ЗАГРУЗКИ
========================= */

const progressBar = document.getElementById("progressBar");
const percent = document.getElementById("percent");

const loadingScreen =
    document.getElementById("loadingScreen");

const mainScreen =
    document.getElementById("mainScreen");

let progress = 0;

const loadingInterval = setInterval(() => {

    progress += Math.random() * 3 + 1;

    if (progress >= 100) {
        progress = 100;
        clearInterval(loadingInterval);

        setTimeout(() => {

            loadingScreen.classList.add("hide");

            setTimeout(() => {
                mainScreen.classList.add("show");
            }, 500);

        }, 500);
    }

    progressBar.style.width = progress + "%";

    percent.textContent =
        Math.floor(progress) + "%";

}, 100);

</script>

</body>
</html>
