<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wedding Day | The Sims 4</title>

<style>

/* =========================
   ОСНОВА
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    font-family: Arial, sans-serif;
    background: #080d25;
}

/* =========================
   ЭКРАН ЗАГРУЗКИ
========================= */

#loadingScreen {
    position: fixed;
    inset: 0;
    z-index: 100;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at 50% 85%,
            #344d80 0%,
            #17264e 40%,
            #080d25 100%
        );

    transition:
        opacity 1.2s ease,
        visibility 1.2s ease;
}

#loadingScreen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

/* =========================
   ЗВЁЗДНОЕ НЕБО
========================= */

.stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 8px white;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.2; transform: scale(0.7); }
    to   { opacity: 1;   transform: scale(1.3); }
}

/* =========================
   3D ЗНАЧОК
========================= */

.logo-wrapper {
    width: 145px;
    height: 145px;
    margin-bottom: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 650px;
    perspective-origin: center;
    animation: float3D 3s ease-in-out infinite;
}

.logo-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform-style: preserve-3d;
    filter:
        drop-shadow(0 0 8px rgba(100,255,130,0.8))
        drop-shadow(0 0 20px rgba(50,220,100,0.5))
        drop-shadow(0 0 35px rgba(50,220,100,0.25));
    animation: spin3D 4s linear infinite;
}

@keyframes spin3D {
    0%   { transform: rotateY(0deg)   rotateX(8deg);  }
    25%  { transform: rotateY(90deg)  rotateX(0deg);  }
    50%  { transform: rotateY(180deg) rotateX(-8deg); }
    75%  { transform: rotateY(270deg) rotateX(0deg);  }
    100% { transform: rotateY(360deg) rotateX(8deg);  }
}

@keyframes float3D {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-12px); }
}

/* =========================
   ЗАГОЛОВОК
========================= */

.game-title {
    color: white;
    font-size: clamp(27px, 5vw, 45px);
    font-weight: 800;
    letter-spacing: 3px;
    text-align: center;
    text-shadow: 0 3px 15px rgba(0,0,0,0.5);
}

.game-subtitle {
    color: #c7d8f5;
    font-size: 13px;
    letter-spacing: 4px;
    margin-top: 12px;
    text-transform: uppercase;
    text-align: center;
}

/* =========================
   СВАДЕБНЫЙ ТЕКСТ
========================= */

.wedding-text {
    color: #ffffff;
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 1px;
    text-align: center;
    margin-top: 38px;
    padding: 0 20px;
}

.wedding-caption {
    color: #b9c8e7;
    font-size: 12px;
    letter-spacing: 2px;
    margin-top: 12px;
    text-align: center;
}

/* =========================
   ЗАГРУЗКА
========================= */

.loading-bottom {
    position: absolute;
    bottom: 12%;
    width: min(320px, 75%);
    text-align: center;
}

.loading-text {
    color: white;
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 15px;
    animation: blink 1.3s infinite;
}

@keyframes blink {
    50% { opacity: 0.4; }
}

.progress-track {
    height: 7px;
    background: rgba(255,255,255,0.18);
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.25);
}

.progress-bar {
    height: 100%;
    width: 0%;
    border-radius: 20px;
    background: linear-gradient(90deg, #48d66e, #b8ff9c);
    box-shadow: 0 0 12px #5aff80;
    transition: width 0.15s linear;
}

.loading-percent {
    color: rgba(255,255,255,0.7);
    font-size: 11px;
    margin-top: 10px;
    letter-spacing: 2px;
}

/* =========================
   ГЛАВНЫЙ ЭКРАН (СКРОЛЛ)
========================= */

/* mainScreen больше не fixed на весь экран,
   а обычная страница, которая скроллится вниз.
   scroll-snap делает так, что разделы «прилипают» к экрану —
   как на классических лендингах. */

#mainScreen {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;

    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;

    background: #080d25;

    opacity: 0;
    visibility: hidden;
    transition: opacity 1.2s ease, visibility 1.2s ease;

    /* скрываем скроллбар для чистого вида (по желанию) */
    scrollbar-width: none;
}
#mainScreen::-webkit-scrollbar {
    display: none;
}

#mainScreen.show {
    opacity: 1;
    visibility: visible;
}

/* Каждый экран — на всю высоту видимой области */
.section {
    position: relative;
    width: 100%;
    height: 100vh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    overflow: hidden;
}

.section img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    user-select: none;
    -webkit-user-drag: none;
}

/* =========================
   МЯГКИЙ ХИНТ «ЛИСТАЙ ВНИЗ»
========================= */

.scroll-hint {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;

    color: rgba(255,255,255,0.85);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;

    pointer-events: none;
    animation: hintFloat 2s ease-in-out infinite;
}

.scroll-hint .arrow {
    width: 20px;
    height: 20px;
    border-right: 2px solid rgba(255,255,255,0.85);
    border-bottom: 2px solid rgba(255,255,255,0.85);
    transform: rotate(45deg);
}

@keyframes hintFloat {
    0%, 100% { transform: translate(-50%, 0); }
    50%      { transform: translate(-50%, 8px); }
}

/* =========================
   МОБИЛЬНАЯ АДАПТАЦИЯ
========================= */

@media (max-width: 600px) {
    .logo-wrapper {
        width: 115px;
        height: 115px;
        margin-bottom: 30px;
    }
    .game-title {
        font-size: 29px;
        letter-spacing: 2px;
    }
    .game-subtitle {
        font-size: 11px;
        letter-spacing: 3px;
    }
    .wedding-text {
        font-size: 15px;
        line-height: 1.5;
    }
    .wedding-caption {
        font-size: 11px;
    }
    .loading-bottom {
        bottom: 13%;
    }
    .scroll-hint {
        bottom: 20px;
        font-size: 10px;
        letter-spacing: 2px;
    }
}

/* =========================
   УМЕНЬШЕНИЕ АНИМАЦИИ
========================= */

@media (prefers-reduced-motion: reduce) {
    .logo-wrapper,
    .logo-wrapper img,
    .star,
    .scroll-hint {
        animation: none;
    }
}

</style>
</head>

<body>

<!-- =========================
     ЭКРАН ЗАГРУЗКИ
========================= -->

<div id="loadingScreen">

    <div class="stars" id="stars"></div>

    <div class="logo-wrapper">
        <img
            src="Изображение_1-removebg-preview-2.png"
            alt="Wedding Symbol"
        >
    </div>

    <div class="game-title">
        THE SIMS 4
    </div>

    <div class="game-subtitle">
        Wedding Edition
    </div>

    <div class="wedding-text">
        Готовим самый счастливый день…
    </div>

    <div class="wedding-caption">
        История любви начинается
    </div>

    <div class="loading-bottom">

        <div class="loading-text">
            Загрузка свадебного дня...
        </div>

        <div class="progress-track">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="loading-percent" id="percent">
            0%
        </div>

    </div>

</div>


<!-- =========================
     ГЛАВНЫЙ ЭКРАН (СКРОЛЛ)
========================= -->

<div id="mainScreen">

    <!-- ЭКРАН 1 -->
    <section class="section" id="screen1">
        <img
            src="Изображение.jpeg"
            alt="Первый экран свадебного приглашения"
        >

        <div class="scroll-hint">
            <span>Листай вниз</span>
            <div class="arrow"></div>
        </div>
    </section>

    <!-- ЭКРАН 2 -->
    <section class="section" id="screen2">
        <img
            src="Изображение 2.jpeg"
            alt="Второй экран свадебного приглашения"
        >
    </section>

</div>


<script>

/* =========================
   СОЗДАНИЕ ЗВЁЗД
========================= */

const starsContainer = document.getElementById("stars");

for (let i = 0; i < 110; i++) {
    const star = document.createElement("div");
    star.className = "star";

    star.style.left = Math.random() * 100 + "%";
    star.style.top  = Math.random() * 100 + "%";
    star.style.animationDelay    = Math.random() * 3 + "s";
    star.style.animationDuration = (1 + Math.random() * 3) + "s";

    const size = 1 + Math.random() * 3;
    star.style.width  = size + "px";
    star.style.height = size + "px";

    starsContainer.appendChild(star);
}


/* =========================
   ЭЛЕМЕНТЫ
========================= */

const progressBar   = document.getElementById("progressBar");
const percent       = document.getElementById("percent");
const loadingScreen = document.getElementById("loadingScreen");
const mainScreen    = document.getElementById("mainScreen");

const screen1Img = document.querySelector("#screen1 img");
const screen2Img = document.querySelector("#screen2 img");


/* =========================
   ПРЕДЗАГРУЗКА ИЗОБРАЖЕНИЙ
========================= */

function preloadImage(image) {
    return new Promise((resolve) => {
        if (image.complete && image.naturalWidth > 0) {
            resolve(true);
            return;
        }
        image.onload  = () => resolve(true);
        image.onerror = () => resolve(false);
    });
}


/* =========================
   ЗАПУСК САЙТА
========================= */

async function startWeddingWebsite() {

    const ok1 = await preloadImage(screen1Img);
    const ok2 = await preloadImage(screen2Img);

    console.log("Фото 1 загружено:", ok1, "|", screen1Img.src);
    console.log("Фото 2 загружено:", ok2, "|", screen2Img.src);

    if (!ok1) {
        console.error("❗ Не загрузилось фото 1. Проверь путь/имя:", screen1Img.src);
    }
    if (!ok2) {
        console.error("❗ Не загрузилось фото 2. Проверь путь/имя:", screen2Img.src);
        console.error("   Возможные причины: пробел в имени, кириллица, .jpg vs .jpeg vs .png.");
    }

    // Прячем загрузку и показываем скроллящуюся страницу
    loadingScreen.classList.add("hide");
    mainScreen.classList.add("show");

    // Сбрасываем скролл в начало — на фото 1
    mainScreen.scrollTop = 0;
}


/* =========================
   АНИМАЦИЯ ЗАГРУЗКИ
========================= */

let progress = 0;

const loadingInterval = setInterval(() => {

    progress += Math.random() * 3 + 1;

    if (progress >= 100) {
        progress = 100;
        clearInterval(loadingInterval);
        progressBar.style.width = "100%";
        percent.textContent = "100%";

        setTimeout(() => {
            startWeddingWebsite();
        }, 700);

        return;
    }

    progressBar.style.width = progress + "%";
    percent.textContent = Math.floor(progress) + "%";

}, 100);

</script>

</body>
</html>
