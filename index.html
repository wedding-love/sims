
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Day</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #080d25;
}

/* ЗАСТАВКА */

#loadingScreen {
    position: fixed;
    inset: 0;
    z-index: 10;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at 50% 85%,
            #344d80 0%,
            #17264e 40%,
            #080d25 100%
        );

    transition: opacity 1.2s ease,
                visibility 1.2s ease;
}

#loadingScreen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

/* ЗВЁЗДЫ */

.stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 8px white;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from {
        opacity: 0.2;
        transform: scale(0.7);
    }

    to {
        opacity: 1;
        transform: scale(1.3);
    }
}

/* ВРАЩАЮЩЕЕСЯ ИЗОБРАЖЕНИЕ */

.logo-wrapper {
    width: 125px;
    height: 125px;
    margin-bottom: 35px;

    display: flex;
    align-items: center;
    justify-content: center;

    animation: rotateLogo 5s linear infinite;

    filter: drop-shadow(0 0 18px rgba(120,255,160,0.5));
}

.logo-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* Вращение по кругу */

@keyframes rotateLogo {
    from {
        transform: rotateY(0deg);
    }

    to {
        transform: rotateY(360deg);
    }
}

/* ЗАГОЛОВОК */

.game-title {
    color: white;
    font-size: clamp(25px, 5vw, 43px);
    font-weight: 800;
    letter-spacing: 3px;
    text-align: center;
    text-shadow: 0 3px 15px rgba(0,0,0,0.5);
}

.game-subtitle {
    color: #c7d8f5;
    font-size: 13px;
    letter-spacing: 4px;
    margin-top: 12px;
    text-transform: uppercase;
    text-align: center;
}

/* СВАДЕБНЫЙ ТЕКСТ */

.wedding-text {
    color: #fff;
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 1px;
    text-align: center;
    margin-top: 38px;
    padding: 0 20px;
}

.wedding-caption {
    color: #b9c8e7;
    font-size: 12px;
    letter-spacing: 2px;
    margin-top: 12px;
    text-align: center;
}

/* ЗАГРУЗКА */

.loading-bottom {
    position: absolute;
    bottom: 12%;
    width: min(320px, 75%);
    text-align: center;
}

.loading-text {
    color: white;
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 15px;
    animation: blink 1.3s infinite;
}

@keyframes blink {
    50% {
        opacity: 0.4;
    }
}

.progress-track {
    height: 7px;
    background: rgba(255,255,255,0.18);
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.25);
}

.progress-bar {
    height: 100%;
    width: 0%;
    border-radius: 20px;

    background: linear-gradient(
        90deg,
        #48d66e,
        #b8ff9c
    );

    box-shadow: 0 0 12px #5aff80;
    transition: width 0.15s linear;
}

.loading-percent {
    color: rgba(255,255,255,0.7);
    font-size: 11px;
    margin-top: 10px;
    letter-spacing: 2px;
}

/* ГЛАВНЫЙ ЭКРАН */

#mainScreen {
    position: fixed;
    inset: 0;

    opacity: 0;
    visibility: hidden;

    transition: opacity 1.5s ease;
    background: #111;
}

#mainScreen.show {
    opacity: 1;
    visibility: visible;
}

#mainScreen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
}

/* МОБИЛЬНАЯ ВЕРСИЯ */

@media (max-width: 600px) {

    .logo-wrapper {
        width: 105px;
        height: 105px;
        margin-bottom: 30px;
    }

    .game-title {
        letter-spacing: 2px;
    }

    .wedding-text {
        font-size: 15px;
        line-height: 1.5;
    }

    .game-subtitle {
        font-size: 11px;
        letter-spacing: 3px;
    }

    .loading-bottom {
        bottom: 13%;
    }
}
</style>
</head>

<body>

<!-- ЭКРАН ЗАГРУЗКИ -->

<div id="loadingScreen">

    <div class="stars" id="stars"></div>

    <!-- Вращающееся изображение -->

    <div class="logo-wrapper">
        <img
            src="Изображение_1-removebg-preview-2.png"
            alt="Wedding Logo"
        >
    </div>

    <div class="game-title">
        THE SIMS 4
    </div>

    <div class="game-subtitle">
        Wedding Edition
    </div>

    <div class="wedding-text">
        Готовим самый счастливый день…
    </div>

    <div class="wedding-caption">
        История любви начинается
    </div>

    <!-- Полоса загрузки -->

    <div class="loading-bottom">

        <div class="loading-text">
            Загрузка свадебного дня...
        </div>

        <div class="progress-track">
            <div
                class="progress-bar"
                id="progressBar">
            </div>
        </div>

        <div class="loading-percent" id="percent">
            0%
        </div>

    </div>

</div>

<!-- ГЛАВНЫЙ ЭКРАН -->

<div id="mainScreen">

    <img
        src="Изображение.jpeg"
        alt="Свадебное приглашение"
    >

</div>

<script>

/* СОЗДАНИЕ ЗВЁЗД */

const starsContainer =
    document.getElementById("stars");

for (let i = 0; i < 110; i++) {

    const star = document.createElement("div");

    star.className = "star";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";

    star.style.animationDelay =
        Math.random() * 3 + "s";

    star.style.animationDuration =
        (1 + Math.random() * 3) + "s";

    const size = 1 + Math.random() * 3;

    star.style.width = size + "px";
    star.style.height = size + "px";

    starsContainer.appendChild(star);
}

/* АНИМАЦИЯ ЗАГРУЗКИ */

const progressBar =
    document.getElementById("progressBar");

const percent =
    document.getElementById("percent");

const loadingScreen =
    document.getElementById("loadingScreen");

const mainScreen =
    document.getElementById("mainScreen");

let progress = 0;

const loadingInterval = setInterval(() => {

    progress += Math.random() * 3 + 1;

    if (progress >= 100) {

        progress = 100;

        clearInterval(loadingInterval);

        setTimeout(() => {

            loadingScreen.classList.add("hide");

            setTimeout(() => {

                mainScreen.classList.add("show");

            }, 500);

        }, 500);
    }

    progressBar.style.width = progress + "%";

    percent.textContent =
        Math.floor(progress) + "%";

}, 100);

</script>

</body>
</html>
